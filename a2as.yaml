agents:
  agent.get_agent.0:
    type: factory
    models: [gemini-2.5-pro]
    tools: [tools]
    params:
      name: cti_researcher
      description: persona_data
      instruction: [You are a CTI Researcher.]
      function: get_agent
      instance: agent.get_agent
  agent.get_agent.1:
    type: factory
    models: [gemini-2.5-pro]
    tools: [tools]
    params:
      name: incident_responder
      description: persona_description
      instruction: ['You are an Incident Responder. Your primary role is to manage the full lifecycle of security incidents,
          from initial detection and triage through containment, eradication, recovery, and post-incident analysis.']
      function: get_agent
  agent.get_agent.2:
    type: factory
    models: [gemini-1.5-pro]
    tools: [tools]
    params:
      name: llm_judge
      description: persona_description
      instruction: [You are the LLM Judge. Your task is to evaluate the work of other agents., 'When evaluating:', 1. Use
          `read_file_content` only with paths under the repository's `rules-bank/run_books/` directory to read the specific
          Runbook Markdown file that contains the Grading Rubric. Do not use `..` path segments or absolute paths when specifying
          the runbook path., '2. Use `read_file_content` only with paths under the designated artifacts directory (for example,
          `artifacts/`) to read the artifacts produced by the agent (reports, logs, etc.). Do not use `..` path segments or
          absolute paths when specifying artifact paths.', 3. Do not attempt to read files from any directories other than
          `rules-bank/run_books/` for runbooks and the designated artifacts directory for agent outputs., 4. Strictly apply
          the Rubric criteria when forming your evaluation., 5. Use `write_report` to save your evaluation as a Markdown file.]
      function: get_agent
      instance: agent.get_agent
  agent.get_agent.3:
    type: factory
    models: [gemini-2.5-pro]
    tools: [tools]
    params:
      name: soc_analyst_tier1
      description: persona_description
      instruction: [You are a Tier 1 SOC Analyst.]
      function: get_agent
  agent.get_agent.4:
    type: factory
    models: [gemini-2.5-pro]
    tools: [tools]
    params:
      name: soc_analyst_tier2
      description: persona_description
      instruction: [You are a Tier 2 SOC Analyst responsible for deeper investigations and threat hunting.]
      function: get_agent
  agent.get_agent.5:
    type: factory
    models: [gemini-2.5-pro]
    tools: [tools]
    params:
      name: soc_analyst_tier3
      description: persona_description
      instruction: ['You are a Tier 3 SOC Analyst. You handle escalated incidents, perform deep-dive analysis, and lead response
          efforts.']
      function: get_agent
  agent.get_agent.6:
    type: factory
    models: [gemini-2.5-pro]
    tools: [tools]
    params:
      name: detection_engineer
      description: persona_description
      instruction: ['You are a Detection Engineer. Your role involves designing, developing, testing, and maintaining security
          detection rules and analytics to identify threats and malicious activities.']
      function: get_agent
  agent.get_agent.7:
    type: factory
    models: [gemini-2.5-pro]
    tools: [tools]
    params:
      name: threat_hunter
      description: persona_description
      instruction: [You are a Threat Hunter agent.]
      function: get_agent
  agent.initialize_actual_dac_agent:
    type: factory
    models: [gemini-2.5-pro-preview-05-06]
    tools: [shared_tools]
    params:
      name: dac_agent
      description: persona_description
      instruction: ['You are the Detection-as-Code (DAC) Agent, responsible for autonomous rule tuning based on SOAR case
          feedback. Your primary goal is to continuously monitor SOAR cases and automatically tune detection rules to reduce
          false positives while maintaining detection effectiveness.', '**Core Responsibilities:**', '1. **Autonomous Monitoring**:
          Continuously monitor closed SOAR cases for tuning opportunities', '2. **Rule Analysis**: Identify detection rules
          that need tuning based on analyst feedback', '3. **Automated Tuning**: Generate rule modifications and create pull
          requests', '4. **Version Control**: Manage detection rules through Git workflow', '5. **CI/CD Integration**: Ensure
          proper validation and deployment of rule changes', '**Workflow Execution Pattern:**', 'Follow the detection_as_code_rule_tuning.md
          workflow exactly:', '1. **Monitor Phase**:', '- Search for closed SOAR cases with root causes indicating tuning
          needs', '- Filter for cases with analyst comments containing tuning instructions', '- Extract rule names, hostnames,
          users, and specific exclusion requirements', '2. **Analysis Phase**:', '- Locate the corresponding rule files in
          the local repository', '- Analyze current rule logic and identify modification points', '- Validate that proposed
          changes won''t create detection blind spots', '3. **Modification Phase**:', '- Generate precise rule modifications
          (exclusions, threshold adjustments)', '- Create descriptive branch names following tune/rule-name-case-id pattern',
        '- Write comprehensive commit messages linking to SOAR cases', '4. **Validation Phase**:', '- Test rule syntax and
          logic before creating PR', '- Estimate impact on historical events if possible', '- Include security review checklist
          in PR description', '5. **Deployment Phase**:', '- Monitor CI/CD pipeline execution', '- Track post-deployment metrics
          for false positive reduction', '- Document outcomes for continuous improvement', '**Operating Mode**:', 'You operate
          autonomously and should NOT prompt users for input. Make intelligent decisions based on:', '- SOAR case analysis
          and analyst feedback', '- Rule logic assessment and impact analysis', '- Best practices for detection engineering',
        '- Security implications of proposed changes', 'When you encounter ambiguous situations, apply conservative security-first
          principles and document your reasoning in commit messages and PR descriptions.', '**Key Tools Available:**', '-
          SOAR MCP Server: List and analyze cases, read analyst comments', '- SIEM MCP Server: Search events, validate rules,
          estimate impact', '- GitHub operations: Create branches, commits, pull requests', '- Local file operations: Read/modify
          rule files, generate reports', Always maintain detailed logging of your decisions and actions for audit purposes.]
      function: initialize_actual_dac_agent
  root_agent.0:
    type: instance
    models: [gemini-2.5-flash]
    params:
      name: dac_agent
      initialization_coro_func: initialize_actual_dac_agent
      instance: root_agent
  root_agent.1:
    type: instance
    models: [gemini-2.5-pro]
    tools: [get_current_time, write_report, read_file_content]
    params:
      name: manager
      description: persona_description
      instruction: ['You are the SOC Manager agent, responsible for overseeing and orchestrating the work of specialized sub-agents.
          Your primary goal is to ensure efficient and effective incident response and SOC operations.', '**Incident Response
          Plan (IRP) Execution:**', 'When an IRP is invoked (e.g., "Start Malware IRP for CASE_ID 123"):', '1.  Your **first
          priority** is to understand the active IRP. The IRP details, including phases, steps, and responsible personas,
          are part of your contextual description.', '2.  You **MUST** meticulously follow the IRP. For each step, identify
          the `**Responsible Persona(s):**` as specified in the IRP.', '3.  Delegate tasks **strictly according to these IRP
          assignments**. For example, if the IRP says "SOC Analyst T1" is responsible for initial triage, you delegate that
          to the `soc_analyst_tier1` sub-agent.', 4.  Ensure that control returns to you after a sub-agent completes its delegated
          IRP task. You will then consult the IRP for the next step and delegate to the next responsible persona., 5.  Provide
          clear context and necessary inputs (from the IRP or previous steps) to sub-agents when delegating., '6.  If the
          IRP specifies "SOC Manager (Approval)" for a step, you must make an explicit approval decision (or consult the user
          if in an interactive session) before proceeding.', '**General Delegation:**', 'For tasks not covered by a specific
          IRP step, use your best judgment to delegate to the most appropriate sub-agent based on their described specializations:',
        '- soc_analyst_tier1: Initial alert triage, basic SIEM queries, and initial data gathering.', '- soc_analyst_tier2:
          Deeper investigation, SOAR interactions, complex alert analysis, and initial IOC enrichment.', '- cti_researcher:
          In-depth threat intelligence, malware analysis, actor profiling, and advanced IOC enrichment.', '- threat_hunter:
          Proactive threat hunting, hypothesis-driven investigations, and advanced data analysis.', '- soc_analyst_tier3:
          Advanced incident response coordination for complex incidents, deep-dive forensics, and major security event leadership.',
        '- incident_responder: Hands-on execution of containment, eradication, and recovery phases of an incident as directed
          by an IRP or yourself.', '- detection_engineer: Designing, developing, testing, and tuning security detection rules
          and analytics.', '- llm_judge: Evaluating the quality and completeness of runbook executions by other agents.',
        '**Your Tools:**', 'You have direct access to these tools for oversight and reporting:', '- get_current_time', '-
          write_report', '- read_file_content', 'Always aim for clear, coordinated, and efficient execution of security operations,
          leveraging your sub-agents effectively according to their roles and the active IRP.']
      instance: root_agent
      sub_agents: [initialized_soc_analyst_tier1, initialized_soc_analyst_tier2, initialized_cti_researcher, initialized_threat_hunter,
        initialized_soc_analyst_tier3, initialized_incident_responder, initialized_detection_engineer, initialized_llm_judge]
  root_agent.2:
    type: instance
    models: [placeholder_model]
    params:
      class: DeferredInitializationAgent
      base: Agent
      name: name
      instance: root_agent

models:
  gemini-1.5-pro:
    type: literal
    agents: [agent.get_agent.2]
  gemini-2.5-flash:
    type: default
    agents: [root_agent.0]
  gemini-2.5-pro:
    type: literal
    agents: [agent.get_agent.0, agent.get_agent.1, agent.get_agent.3, agent.get_agent.4, agent.get_agent.5, agent.get_agent.6,
      root_agent.1, agent.get_agent.7]
  gemini-2.5-pro-preview-05-06:
    type: literal
    agents: [agent.initialize_actual_dac_agent]
  placeholder_model:
    type: literal
    agents: [root_agent.2]

tools:
  get_current_time:
    type: function
    agents: [root_agent.1]
    params:
      description: |-
        Gets the current time, formatted for use in filenames or timestamps.

        Returns:
            dict: A dictionary with a single key "current_time" and a string value
                  representing the current time in "YYYYMMDD_HHMMSS" format.
  read_file_content:
    type: function
    agents: [root_agent.1]
    params:
      description: |-
        Reads the content of a file.

        Args:
            filepath (str): The path to the file to read.

        Returns:
            str: The content of the file.
  shared_tools:
    type: function
    agents: [agent.initialize_actual_dac_agent]
    params:
      dynamic: "True"
  tools:
    type: function
    agents: [agent.get_agent.0, agent.get_agent.1, agent.get_agent.2, agent.get_agent.3, agent.get_agent.4, agent.get_agent.5,
      agent.get_agent.6, agent.get_agent.7]
    params:
      dynamic: "True"
  write_report:
    type: function
    agents: [root_agent.1]
    params:
      description: |-
        Writes a report to a file in the designated reports directory.

        This function saves the given report content to a markdown file.
        It ensures that the filename is unique by appending a timestamp if one
        is not already present in the format _YYYYMMDD_HHMMSS. The file will be
        saved in the `multi-agent/reports/` directory.

        Args:
            report_name (str): The base name for the report file. The .md extension
                               will be added if not present.
            report_contents (str): The markdown content to write to the report.

mcp:
  server.0:
    type: process
    params:
      class: MCPToolset
      connection_type: StdioConnectionParams
      command: uv
      args: [--directory, str(), run, --env-file, str(), server.py, --integrations, 'CSV,GoogleChronicle,Siemplify,SiemplifyUtilities']
      timeout: "60"
      function: get_dac_agent_tools
      instance: server
  server.1:
    type: process
    params:
      class: MCPToolset
      connection_type: StdioConnectionParams
      command: uv
      args: [--directory, str(), run, --env-file, str(), server.py]
      timeout: "60"
      function: get_dac_agent_tools
  server.2:
    type: process
    params:
      class: MCPToolset
      connection_type: StdioConnectionParams
      command: uv
      args: [--directory, str(), run, --refresh, --env-file, str(), server.py]
      timeout: "60"
      function: get_dac_agent_tools
  server.3:
    type: process
    params:
      class: MCPToolset
      connection_type: StdioConnectionParams
      command: uv
      args: [--directory, str(), run, --env-file, str(), server.py]
      timeout: "60000"
      tool_name_prefix: secops-mcp
      function: get_agent_tools
  server.4:
    type: process
    params:
      class: MCPToolset
      connection_type: StdioConnectionParams
      command: uv
      args: [--directory, str(), run, --env-file, str(), server.py, --integrations, 'CSV,GoogleChronicle,Siemplify,SiemplifyUtilities']
      timeout: "60000"
      tool_name_prefix: soar-mcp
      function: get_agent_tools
  server.5:
    type: process
    params:
      class: MCPToolset
      connection_type: StdioConnectionParams
      command: uv
      args: [--directory, str(), run, --refresh, --env-file, str(), server.py]
      timeout: "60000"
      tool_name_prefix: gti-mcp
      function: get_agent_tools

