    type: literal
    actions: [read]
    params:
      caller: [get_dac_agent_tools, get_agent_tools]
      path: [mcp_security_path]
  agent.py:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), agent.py]
  execution_metrics.jsonl:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [log_dir, execution_metrics.jsonl]
  file_name:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [reports_dir, file_name]
  file_path:
    type: variable
    actions: [write, read]
    params:
      caller: [open, yaml.safe_load]
      alias: [f]
  filepath:
    type: variable
    actions: [read]
    params:
      caller: [open]
      alias: [f]
  log_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]
  log_file:
    type: variable
    actions: [write, read]
    params:
      caller: [open]
      alias: [f]
  persona_file_path:
    type: variable
    actions: [read]
    params:
      caller: [open]
      alias: [f]
  reports_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]
  rule_file_path:
    type: variable
    actions: [read, write]
    params:
      caller: [open, yaml.safe_load]
      alias: [f]
  runbook_file:
    type: variable
    actions: [read]
    params:
      caller: [open]
      alias: [f]
  search_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.walk]
  tools.py:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), tools, tools.py]
  workflow.py:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), workflow.py]

processes:
  gh:
    type: shell
    actions: [exec]
    args: [[pr, create, --title, 'Tune {...} - Case #{...} False Positive', --body, --base, base_branch]]
    params:
      caller: [subprocess.run]
      shell: ["False"]
  git:
    type: shell
    actions: [exec]
    args: [[fetch, origin], [checkout, base_branch], [pull, origin, base_branch], [checkout, -b, 'tune/{...}-case-{...}'],
      [add, file_path], [commit, -m, commit_message], [push, -u, origin, 'tune/{...}-case-{...}']]
    params:
      caller: [subprocess.run]
      shell: ["False", "False", "False", "False", "False", "False", "False"]
  uv:
    type: mcp
    actions: [exec]
    args: [[--directory, run, --env-file, server.py, --integrations, 'CSV,GoogleChronicle,Siemplify,SiemplifyUtilities'],
      [--directory, run, --env-file, server.py], [--directory, run, --refresh, --env-file, server.py], [--directory, run,
        --env-file, server.py], [--directory, run, --env-file, server.py, --integrations, 'CSV,GoogleChronicle,Siemplify,SiemplifyUtilities'],
      [--directory, run, --refresh, --env-file, server.py]]
    params:
      caller: [StdioServerParameters]
      shell: ["False", "False", "False", "False", "False", "False"]
