name: Test Remote MCP Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-remote-mcp:
    runs-on: ubuntu-latest
    # Run only if GOOGLE_CREDENTIALS secret is available to avoid failure in forks
    if: ${{ secrets.GOOGLE_CREDENTIALS != '' }}

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r multi-agent/requirements.txt

      - name: Run Remote MCP Tests
        env:
          CHRONICLE_PROJECT_ID: ${{ secrets.CHRONICLE_PROJECT_ID }}
          CHRONICLE_CUSTOMER_ID: ${{ secrets.CHRONICLE_CUSTOMER_ID }}
          CHRONICLE_REGION: ${{ secrets.CHRONICLE_REGION }}
        run: |
          python -m unittest multi-agent/tests/test_remote_mcp.py
