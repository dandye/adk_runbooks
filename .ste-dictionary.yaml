technical_verbs:
- term: isolate
  part_of_speech: verb
  definition: Disconnect an endpoint from the network to halt threat activity.
  approved_usage: Isolate affected endpoints immediately.
- term: quarantine
  part_of_speech: verb
  definition: Move a malicious email or file to a secure isolated store.
  approved_usage: Quarantine matching phishing messages in user mailboxes.
- term: re-image
  part_of_speech: verb
  definition: Reinstall the operating system from a verified clean image.
  approved_usage: Clean or re-image infected hosts.
- term: enrich
  part_of_speech: verb
  definition: Add threat intelligence reputation data to an indicator.
  approved_usage: Enrich extracted indicators with threat intelligence tools.
- term: patch
  part_of_speech: verb
  definition: Apply software updates to resolve security vulnerabilities.
  approved_usage: Install security patches before you connect hosts to the network.
- term: escalate
  part_of_speech: verb
  definition: Assign or forward an incident to a higher tier or specialist.
  approved_usage: Escalate the case to Tier 2 if containment fails.
- term: triage
  part_of_speech: verb
  definition: Perform initial analysis and severity prioritization.
  approved_usage: Triage incoming security alerts.
- term: authenticate
  part_of_speech: verb
  definition: Technical action verb for authenticate process in SOC operations.
  approved_usage: Authenticate the target entity according to security policy.
- term: close
  part_of_speech: verb
  definition: Technical action verb for close process in SOC operations.
  approved_usage: Close the target entity according to security policy.
- term: contain
  part_of_speech: verb
  definition: Technical action verb for contain process in SOC operations.
  approved_usage: Contain the target entity according to security policy.
- term: eradicate
  part_of_speech: verb
  definition: Technical action verb for eradicate process in SOC operations.
  approved_usage: Eradicate the target entity according to security policy.
- term: revoke
  part_of_speech: verb
  definition: Technical action verb for revoke process in SOC operations.
  approved_usage: Revoke the target entity according to security policy.
- term: tune
  part_of_speech: verb
  definition: Technical action verb for tune process in SOC operations.
  approved_usage: Tune the target entity according to security policy.
forbidden_project_words:
- word: ensure
  replacement: make sure / to [verb]
- word: retrieve
  replacement: get
- word: via
  replacement: with
- word: locate
  replacement: find
- word: categorize
  replacement: classify
- word: prior to
  replacement: before
- word: utilize
  replacement: use
- word: subsequently
  replacement: then
- word: terminate
  replacement: stop / close
