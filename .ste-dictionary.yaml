technical_names:
- term: file hash
  part_of_speech: noun
  category: data
  definition: Cryptographic hash identifying a file (MD5, SHA1, SHA256).
  forbidden_synonyms:
  - hash digest
- term: MD5
  part_of_speech: noun
  category: data
  definition: 128-bit cryptographic hash algorithm.
- term: SHA1
  part_of_speech: noun
  category: data
  definition: 160-bit cryptographic hash algorithm.
- term: SHA256
  part_of_speech: noun
  category: data
  definition: 256-bit cryptographic hash algorithm.
